services:
  web:
    image: nginx:alpine
    container_name: journal-web
    ports:
      - "8080:80"
    volumes:
      - ./nutrition/meal-plans/web:/var/www/meals:ro
      - ./style/capsule:/var/www/style:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  news:
    image: nginx:alpine
    container_name: daily-brief
    ports:
      - "8082:80"
    volumes:
      - ./news/site:/var/www/news:ro
      - ./news/site/nginx-news.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  journal-site:
    build: ./journal-site
    container_name: journal-site
    ports:
      - "8084:5000"
    volumes:
      - ./journal-site:/app/src
      - ./journal:/app/journal:ro
      - journal-data:/app/data
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - JOURNAL_DIR=/app/journal
    restart: unless-stopped

volumes:
  journal-data:
