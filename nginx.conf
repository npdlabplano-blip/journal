# Meal Plans
server {
    listen 80;
    server_name meals.namsler.com meals.*;
    root /var/www/meals;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# Style Capsule
server {
    listen 80;
    server_name style.namsler.com style.*;
    root /var/www/style;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# Catch-all — reject unknown hostnames
server {
    listen 80 default_server;
    return 444;
}
