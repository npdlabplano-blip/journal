<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Daily Brief</title>
  <meta name="description" content="A curated daily news journal covering world politics, DFW news, AI, JPMorgan Chase, and local events.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="./" class="site-logo">The Daily <span>Brief</span></a>
      <button class="mobile-menu-btn" aria-label="Toggle menu" onclick="document.querySelector('.site-nav').classList.toggle('open')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <nav class="site-nav">
        <a href="./" class="active">Home</a>
        <a href="./pages/world-politics.html">World</a>
        <a href="./pages/us-politics.html">US Politics</a>
        <a href="./pages/dfw-politics.html">DFW News</a>
        <a href="./pages/ai-news.html">AI</a>
        <a href="./pages/jpmorgan-chase.html">JPMC</a>
        <a href="./pages/dfw-events.html">DFW Events</a>
        <a href="./pages/national-events.html">National</a>
        <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="site-container">
    <!-- Date bar -->
    <div class="date-bar">
      <p class="edition-date" id="editionDate"></p>
      <h1 class="edition-label">Today's Headlines</h1>
    </div>

    <!-- Hero / lead story -->
    <section class="hero-section" id="heroSection"></section>

    <!-- Category sections (3 articles each, with "View All" link) -->
    <div id="categorySections"></div>
  </main>

  <footer class="site-footer">
    <div class="site-container">
      <p>The Daily Brief &mdash; A personal news journal. Curated daily.</p>
      <div class="footer-links">
        <a href="./pages/world-politics.html">World Politics</a>
        <a href="./pages/us-politics.html">US Politics</a>
        <a href="./pages/dfw-politics.html">DFW News</a>
        <a href="./pages/ai-news.html">AI News</a>
        <a href="./pages/jpmorgan-chase.html">JPMorgan Chase</a>
        <a href="./pages/dfw-events.html">DFW Events</a>
        <a href="./pages/national-events.html">National Events</a>
      </div>
    </div>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
